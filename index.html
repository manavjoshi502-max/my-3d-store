<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My 3D Store</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow-x: hidden;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
    }

    #scene {
      position: fixed;
      inset: 0;
      z-index: -1;
    }

    .content {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      background: radial-gradient(
        circle at center,
        rgba(255,255,255,0.08),
        rgba(0,0,0,0.7)
      );
    }

    .hero {
      max-width: 700px;
    }

    .small {
      letter-spacing: 5px;
      font-size: 13px;
      color: #bbbbbb;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(55px, 15vw, 120px);
      letter-spacing: 8px;
      margin-bottom: 15px;
    }

    .description {
      color: #cccccc;
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .price {
      font-size: 24px;
      margin-bottom: 25px;
    }

    .button {
      display: inline-block;
      padding: 16px 35px;
      border-radius: 50px;
      background: white;
      color: black;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .button:hover {
      transform: scale(1.08);
    }

    .products {
      min-height: 100vh;
      padding: 80px 25px;
      background: rgba(0,0,0,0.55);
      text-align: center;
    }

    .products h2 {
      font-size: 42px;
      margin-bottom: 50px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
      max-width: 1000px;
      margin: auto;
    }

    .card {
      padding: 35px 20px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
    }

    .card h3 {
      margin-bottom: 15px;
    }

    .card p {
      color: #bbb;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

  <div id="scene"></div>

  <section class="content">
    <div class="hero">
      <div class="small">PREMIUM 3D STORE</div>

      <h1>PALMORA</h1>

      <p class="description">
        Discover a premium tropical experience
        presented in an immersive 3D world.
      </p>

      <div class="price">₹149</div>

      <a href="#products" class="button">
        SHOP NOW
      </a>
    </div>
  </section>


  <section class="products" id="products">

    <h2>Our Products</h2>

    <div class="cards">

      <div class="card">
        <h3>PALMORA Original</h3>
        <p>Premium tropical beverage</p>
        <strong>₹149</strong>
      </div>

      <div class="card">
        <h3>PALMORA Citrus</h3>
        <p>Fresh citrus experience</p>
        <strong>₹149</strong>
      </div>

      <div class="card">
        <h3>PALMORA Zero</h3>
        <p>Light tropical refreshment</p>
        <strong>₹149</strong>
      </div>

    </div>

  </section>


  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    document
      .getElementById("scene")
      .appendChild(renderer.domElement);


    const geometry =
      new THREE.IcosahedronGeometry(2, 1);

    const material =
      new THREE.MeshStandardMaterial({
        color: 0x8b5cf6,
        metalness: 0.7,
        roughness: 0.25
      });

    const object =
      new THREE.Mesh(geometry, material);

    scene.add(object);


    const light =
      new THREE.PointLight(
        0xffffff,
        3,
        100
      );

    light.position.set(5, 5, 5);

    scene.add(light);


    const ambient =
      new THREE.AmbientLight(
        0xffffff,
        0.4
      );

    scene.add(ambient);


    camera.position.z = 7;


    function animate() {

      requestAnimationFrame(animate);

      object.rotation.x += 0.004;
      object.rotation.y += 0.007;

      renderer.render(
        scene,
        camera
      );
    }

    animate();


    window.addEventListener(
      "resize",
      () => {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );

  </script>

</body>
  </html>
